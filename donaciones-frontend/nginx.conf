server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # config.json se genera al arrancar el contenedor: nunca cachearlo
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # SPA: cualquier ruta del router de Angular devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
