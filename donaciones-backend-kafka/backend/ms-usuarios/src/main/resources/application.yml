server:
  port: 8081

spring:
  # ── Seguridad: el JWT lo emite Keycloak (IDaaS); se valida con su JWKS ──
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/realms/donaciones/protocol/openid-connect/certs}

  application:
    name: ms-usuarios

  # ── Base de datos (valores inyectados desde docker-compose o variables de entorno) ──
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:usuarios_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  expiration: ${JWT_EXPIRATION:86400000}   # 24 h en ms

# Eureka desactivado
eureka:
  client:
    enabled: false

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.donaciones: INFO

# Legado: /api/auth/login emite JWT HS256 propio; ya no es aceptado por los servicios (usar Keycloak)
jwt:
  secret: ${JWT_SECRET:clave-secreta-donaciones-2025-muy-larga-y-segura-minimo-256bits}
  expiration: ${JWT_EXPIRATION:86400000}
